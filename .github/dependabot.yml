# Dependabot, tuned to stay quiet.
#
# Why it is configured this way:
# - interval "monthly": one batch a month instead of a PR per release.
# - groups "all": every update of an ecosystem lands in ONE PR, not one each.
# - open-pull-requests-limit 1: never more than one open PR per ecosystem.
# Security fixes are NOT delayed by this: GitHub opens them as soon as an
# advisory is published (Settings -> Code security -> Dependabot security updates).
# Copy this file into any repo that floods you with Dependabot PRs.
version: 2
updates:
  - package-ecosystem: "pip"            # requirements.txt
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }

  - package-ecosystem: "github-actions" # .github/workflows/*.yml
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }

  - package-ecosystem: "docker"         # base image in Dockerfile
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
