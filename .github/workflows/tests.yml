# Runs the offline test suite on every push and pull request, and checks that
# the dashboard image still builds. conftest.py blocks sockets, so a test that
# forgets to mock a feed or an LLM call fails here too, not only locally.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # The job above runs the DAG tests against a stub Airflow (the real one is
  # not in requirements.txt). This one runs them against Airflow 2.10 itself,
  # on a Python it supports, with the constraints file it was tested with.
  # Airflow goes in first, under its constraints file; the pipeline's own
  # pins come after, without it. The other order let the constraints file
  # downgrade typing_extensions under the pydantic_core that requirements.txt
  # had just installed, and every import then failed.
  airflow-dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-airflow.txt --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_dag_innovation_radar.py -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t innovation-radar .
      # The image must open the committed database, which is the first thing
      # a cold start on Render does.
      - run: docker run --rm innovation-radar python -c "import sys; sys.path.insert(0, '.'); from pipeline.db import get_connection; get_connection().close(); print('ok')"
      # The pytest job runs on 3.12, but the image ships its own Python
      # (python:X-slim in the Dockerfile), and Dependabot bumps that base on its
      # own. Running the suite inside the image checks the interpreter that
      # actually serves the dashboard; test_dashboard.py renders the page with
      # AppTest, so an import or rendering break under the new Python fails
      # here. tests/ is kept out of the image by .dockerignore, hence the
      # read-only mount; no cache provider because the mount is not writable.
      - run: docker run --rm -v "$PWD:/src:ro" -w /src innovation-radar python -m pytest -q -p no:cacheprovider
